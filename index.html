<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMA ESTUDIO</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.contenedor {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #ffffff;
}

.video-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

video {
    display: block;
    max-width: 100vw;
    max-height: 88vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

.video-click {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: pointer;
}

.correo {
    margin-top: 14px;
    color: #000000;
    text-decoration: none;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="video-wrap">
        <video autoplay muted loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <a class="video-click" href="mailto:andres.asenjo@cabeza.cl"></a>
    </div>

    <a class="correo" href="mailto:andres.asenjo@cabeza.cl">
        andres.asenjo@cabeza.cl
    </a>

</div>

</body>
</html>
